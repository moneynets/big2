<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三人大老二</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Microsoft JhengHei',sans-serif;background:#0d3329;color:white}main{max-width:900px;margin:auto;padding:18px}h1{margin:10px 0 16px}input,button{font:inherit;border:0;border-radius:9px;padding:12px}input{width:100%;margin:5px 0;background:white;color:#222}button{background:#ffd369;color:#182b25;font-weight:700;cursor:pointer;margin:4px}button:disabled{opacity:.35;cursor:not-allowed}.panel{background:#1b5242;border-radius:16px;padding:18px;margin:12px 0}.hidden{display:none}.players{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.player{background:#28705a;padding:12px;border-radius:12px;text-align:center}.active{outline:3px solid #ffd369}.table{min-height:120px;text-align:center;padding:20px;border:2px dashed #699f89;border-radius:16px}.cards{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}.card{width:49px;height:75px;background:#fff;color:#181818;border-radius:7px;border:2px solid #ddd;display:flex;flex-direction:column;justify-content:space-between;padding:5px;font-weight:bold;cursor:pointer;user-select:none}.red{color:#cb2737}.selected{transform:translateY(-12px);border:3px solid #ffc83d;background:#fff4c7}.small{font-size:13px;color:#d0e7db}.table .card{display:inline-flex;text-align:left;margin:2px}#log{max-height:150px;overflow:auto;font-size:14px;color:#d8e9e0}#status{color:#ffdd8c;font-weight:bold} @media(max-width:600px){.card{width:41px;height:64px;font-size:14px}.panel{padding:12px}.players{font-size:13px}}</style></head><body><main><h1>🃏 三人大老二</h1><div id="lobby" class="panel"><h2>私人房間</h2><input id="name" placeholder="你的暱稱" maxlength="16"><input id="code" placeholder="房號（建立新房間請留空）" inputmode="numeric"><button onclick="join()">建立 / 加入房間</button><p class="small">3 人 × 18 張，52 張普通牌＋大小王。大小王僅能單張。</p></div><div id="game" class="hidden"><div class="panel"><div>房號：<strong id="room"></strong> <button onclick="copyInvite()">複製邀請連結</button></div><p id="status"></p><button id="start" onclick="start()">房主開始遊戲</button><div class="players" id="players"></div></div><div class="panel"><h3>牌桌</h3><div class="table" id="table">等待開始</div></div><div class="panel"><h3>我的手牌 <span id="count"></span></h3><div id="hand" class="cards"></div><p><button id="play" onclick="play()">出牌</button><button id="pass" onclick="pass()">Pass</button><button onclick="selected.clear();render()">取消選牌</button></p></div><div class="panel"><h3>遊戲紀錄</h3><div id="log"></div></div></div></main><script src="/socket.io/socket.io.js"></script><script>const socket=io();let state=null,token='',selected=new Set();const $=id=>document.getElementById(id);const symbols={C:'♣',D:'♦',H:'♥',S:'♠'};function label(c){return c.joker?(c.joker==='BIG'?'大王':'小王'):(symbols[c.s]+({11:'J',12:'Q',13:'K',14:'A',15:'2'}[c.n]||c.n))}function card(c,selectable=false){const el=document.createElement('div');el.className='card'+((c.s==='D'||c.s==='H')?' red':'')+(selected.has(c.id)?' selected':'');el.textContent=label(c);if(selectable)el.onclick=()=>{selected.has(c.id)?selected.delete(c.id):selected.add(c.id);render()};return el}function request(event,data){socket.emit(event,data,res=>{if(res?.error)alert(res.error);else if(event==='join'){token=res.token;sessionStorage.setItem('big2-'+res.code,token);history.replaceState(null,'','?room='+res.code);$('lobby').classList.add('hidden');$('game').classList.remove('hidden');$('room').textContent=res.code}})}function join(){const name=$('name').value.trim(),code=$('code').value.trim();if(!name)return alert('請輸入暱稱');localStorage.setItem('big2-name',name);request('join',{name,code,token:code?sessionStorage.getItem('big2-'+code):null})}function start(){request('start',{})}function play(){request('play',[...selected])}function pass(){request('pass',{})}function copyInvite(){const url=location.origin+'/?room='+state.code;navigator.clipboard?.writeText(url).then(()=>alert('已複製：'+url)).catch(()=>prompt('複製網址',url))}function render(){if(!state)return;$('room').textContent=state.code;$('players').replaceChildren();state.players.forEach((p,i)=>{const el=document.createElement('div');el.className='player'+(state.turn===i&&state.started&&state.winner===null?' active':'');el.textContent=p.name+(i===state.seat?'（我）':'')+'\n'+(state.started?p.count+' 張':'準備中')+(p.online?' 🟢':' 🔴');el.style.whiteSpace='pre-line';$('players').append(el)});$('start').style.display=!state.started&&state.seat===0?'inline-block':'none';$('status').textContent=state.winner!==null&&state.winner!==undefined?'🏆 '+state.players[state.winner].name+' 獲勝！':!state.started?'等待三人加入後由房主開始':state.turn===state.seat?'輪到你出牌！':'輪到 '+state.players[state.turn].name;$('table').replaceChildren();if(state.table){const title=document.createElement('p');title.textContent=state.players[state.table.by].name+' 出牌';$('table').append(title);state.table.cards.forEach(c=>$('table').append(card(c)))}else $('table').textContent=state.started?'新一輪，自由出牌':'等待開始';$('hand').replaceChildren();state.hand.forEach(c=>$('hand').append(card(c,true)));$('count').textContent='('+state.hand.length+' 張)';const can=state.started&&state.winner===null&&state.turn===state.seat;$('play').disabled=!can||selected.size===0;$('pass').disabled=!can||!state.table;$('log').replaceChildren(...state.log.map(s=>{const p=document.createElement('p');p.textContent=s;return p}))}socket.on('state',s=>{state=s;selected.clear();render()});socket.on('notice',alert);$('name').value=localStorage.getItem('big2-name')||'';$('code').value=new URLSearchParams(location.search).get('room')||'';</script></body></html>
